name: Pull Request Status Check

on:
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    # Declare explicit variables for modern CI environments
    env:
      CI: "true"
      # Give our Pydantic settings fake string tokens so the validation engine passes 
      # during the boot sequence before tests overwrite the values dynamically
      EMAIL_PROVIDER: "sendgrid"
      SENDGRID_API_KEY: "ci_placeholder_token"

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff Linter Check
        run: ruff check src/ tests/

      - name: Run Integration Test Suite
        run: pytest -v
